<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BlogForge AI — Powered by AWS Bedrock</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0e0e0e;
      --paper: #f5f0e8;
      --cream: #ede7d9;
      --accent: #c84b2f;
      --accent2: #2a6b4f;
      --muted: #7a7265;
      --border: #cfc8bb;
      --white: #ffffff;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- NOISE TEXTURE OVERLAY --- */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* --- HEADER --- */
    header {
      position: relative;
      z-index: 1;
      border-bottom: 1px solid var(--border);
      padding: 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      background: var(--paper);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--ink);
    }

    .logo span {
      color: var(--accent);
      font-style: italic;
    }

    .badge {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* --- HERO SECTION --- */
    .hero {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      padding: 80px 32px 48px;
      text-align: center;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .hero-eyebrow::before,
    .hero-eyebrow::after {
      content: '';
      display: block;
      width: 40px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(40px, 6vw, 72px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -1.5px;
      color: var(--ink);
      margin-bottom: 20px;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-sub {
      font-size: 16px;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto 48px;
    }

    /* --- MAIN CARD --- */
    .card {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto 80px;
      padding: 0 32px;
    }

    .card-inner {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 2px 0 var(--border), 0 8px 40px rgba(0,0,0,0.06);
    }

    .card-top {
      padding: 36px 40px 32px;
      border-bottom: 1px solid var(--cream);
    }

    .field-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    input[type="text"] {
      flex: 1;
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 14px 18px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]::placeholder {
      color: var(--border);
      font-style: italic;
    }

    input[type="text"]:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(14,14,14,0.06);
    }

    .generate-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--white);
      background: var(--ink);
      border: none;
      border-radius: 2px;
      padding: 0 28px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
      min-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .generate-btn:hover:not(:disabled) {
      background: var(--accent);
    }

    .generate-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .generate-btn:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }

    /* spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn-text { display: inline; }

    /* suggestions */
    .suggestions {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .suggestions span {
      font-size: 11px;
      font-weight: 300;
      color: var(--muted);
      margin-right: 2px;
    }

    .chip {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 4px 10px;
      cursor: pointer;
      background: transparent;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .chip:hover {
      border-color: var(--ink);
      color: var(--ink);
      background: var(--cream);
    }

    /* status bar */
    .status-bar {
      padding: 12px 40px;
      background: var(--cream);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      display: none;
      align-items: center;
      gap: 10px;
    }

    .status-bar.visible { display: flex; }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* output area */
    .output-area {
      padding: 40px;
      display: none;
    }

    .output-area.visible { display: block; }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--cream);
    }

    .output-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .output-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
    }

    .output-info {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .output-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: var(--muted);
      font-size: 15px;
    }

    .icon-btn:hover {
      border-color: var(--ink);
      color: var(--ink);
      background: var(--cream);
    }

    .blog-text {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      line-height: 1.85;
      color: #2a2520;
      white-space: pre-wrap;
    }

    .blog-text::first-letter {
      font-size: 52px;
      font-weight: 700;
      float: left;
      line-height: 0.85;
      margin-right: 8px;
      margin-top: 6px;
      color: var(--accent);
    }

    /* success badge */
    .s3-notice {
      margin-top: 28px;
      padding: 14px 18px;
      background: #eef6f1;
      border: 1px solid #b8d9c6;
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--accent2);
    }

    .s3-notice svg {
      flex-shrink: 0;
    }

    /* error state */
    .error-box {
      margin: 0 40px 40px;
      padding: 16px 20px;
      background: #fdf1ef;
      border: 1px solid #e8b4aa;
      border-radius: 2px;
      font-size: 13px;
      color: var(--accent);
      display: none;
    }

    .error-box.visible { display: block; }

    /* --- FOOTER STRIP --- */
    .footer-strip {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 20px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-strip p {
      font-size: 12px;
      color: var(--muted);
    }

    .tech-pills {
      display: flex;
      gap: 8px;
    }

    .tech-pill {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--muted);
    }

    /* --- DECORATIVE RULE --- */
    .ornament {
      text-align: center;
      color: var(--border);
      font-size: 18px;
      letter-spacing: 12px;
      margin-bottom: 48px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 600px) {
      header { padding: 0 20px; }
      .hero { padding: 48px 20px 32px; }
      .card { padding: 0 16px; }
      .card-top { padding: 24px 20px 20px; }
      .input-row { flex-direction: column; }
      .generate-btn { padding: 14px; }
      .output-area { padding: 24px 20px; }
      .output-header { flex-direction: column; align-items: flex-start; gap: 14px; }
      .footer-strip { flex-direction: column; gap: 12px; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Blog<span>Forge</span></div>
    <div class="badge">Powered by AWS Bedrock</div>
  </header>

  <section class="hero">
    <div class="hero-eyebrow">Generative AI · Serverless</div>
    <h1>Write smarter,<br/><em>instantly.</em></h1>

  </section>

  <div class="ornament">✦ ✦ ✦</div>

  <div class="card">
    <div class="card-inner">

      <div class="card-top">
        <label class="field-label" for="topic">Your topic</label>
        <div class="input-row">
          <input
            type="text"
            id="topic"
            placeholder="e.g. The future of generative AI in healthcare"
            autocomplete="off"
          />
          <button class="generate-btn" id="generate-btn" onclick="generateBlog()">
            <div class="spinner" id="spinner"></div>
            <span class="btn-text" id="btn-text">Generate</span>
          </button>
        </div>

        <div class="suggestions">
          <span>Try:</span>
          <button class="chip" onclick="setTopic('Machine Learning in Healthcare')">Machine Learning in Healthcare</button>
          <button class="chip" onclick="setTopic('The Future of Cloud Computing')">Cloud Computing</button>
          <button class="chip" onclick="setTopic('Generative AI for Beginners')">Generative AI</button>
          <button class="chip" onclick="setTopic('AWS Serverless Architecture')">AWS Serverless</button>
        </div>
      </div>

      <div class="status-bar" id="status-bar">
        <div class="status-dot"></div>
        <span id="status-text">Connecting to Amazon Bedrock...</span>
      </div>

      <div class="output-area" id="output-area">
        <div class="output-header">
          <div class="output-meta">
            <div class="output-title" id="output-title">Generated Blog</div>
            <div class="output-info" id="output-info">Ready</div>
          </div>
          <div class="output-actions">
            <button class="icon-btn" onclick="copyBlog()" title="Copy to clipboard">&#x2398;</button>
            <button class="icon-btn" onclick="downloadBlog()" title="Download as .txt">&#x2913;</button>
          </div>
        </div>
        <div class="blog-text" id="blog-output"></div>
        <div class="s3-notice">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#2a6b4f" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Blog saved to your S3 bucket — available in the AWS Console under <strong>&nbsp;blog-output/</strong>
        </div>
      </div>

      <div class="error-box" id="error-box"></div>

    </div>
  </div>



  <script>
    // 🔁 REPLACE THIS with your actual API Gateway URL
    const API_URL = "https://YOUR-API-ID.execute-api.us-east-1.amazonaws.com/dev/blog_generation";

    let currentBlog = "";
    let currentTopic = "";

    function setTopic(topic) {
      document.getElementById("topic").value = topic;
      document.getElementById("topic").focus();
    }

    function setStatus(text) {
      document.getElementById("status-text").textContent = text;
    }

    function showError(msg) {
      const box = document.getElementById("error-box");
      box.textContent = "⚠ " + msg;
      box.classList.add("visible");
    }

    function hideError() {
      document.getElementById("error-box").classList.remove("visible");
    }

    async function generateBlog() {
      const topic = document.getElementById("topic").value.trim();
      if (!topic) {
        document.getElementById("topic").focus();
        return;
      }

      currentTopic = topic;
      hideError();

      const btn = document.getElementById("generate-btn");
      const spinner = document.getElementById("spinner");
      const btnText = document.getElementById("btn-text");
      const statusBar = document.getElementById("status-bar");
      const outputArea = document.getElementById("output-area");

      btn.disabled = true;
      spinner.style.display = "block";
      btnText.textContent = "Writing...";
      statusBar.classList.add("visible");
      outputArea.classList.remove("visible");
      setStatus("Connecting to Amazon Bedrock...");

      const messages = [
        "Invoking foundation model...",
        "Generating your blog post...",
        "Almost there...",
        "Saving to S3..."
      ];
      let msgIdx = 0;
      const msgInterval = setInterval(() => {
        msgIdx = (msgIdx + 1) % messages.length;
        setStatus(messages[msgIdx]);
      }, 3500);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ blog_topic: topic })
        });

        clearInterval(msgInterval);
        const data = await response.json();

        if (response.ok && data.blog) {
          currentBlog = data.blog;
          document.getElementById("blog-output").textContent = data.blog;
          document.getElementById("output-title").textContent = topic;
          document.getElementById("output-info").textContent =
            new Date().toLocaleDateString("en-IN", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
          outputArea.classList.add("visible");
          setStatus("✓ Blog generated and saved to S3");
        } else {
          showError(data.error || "Something went wrong. Please try again.");
          setStatus("Generation failed.");
        }
      } catch (err) {
        clearInterval(msgInterval);
        showError("Network error: " + err.message);
        setStatus("Connection failed.");
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "Generate";
        setTimeout(() => statusBar.classList.remove("visible"), 4000);
      }
    }

    function copyBlog() {
      if (!currentBlog) return;
      navigator.clipboard.writeText(currentBlog).then(() => {
        const btn = document.querySelector('.icon-btn');
        btn.textContent = "✓";
        setTimeout(() => btn.textContent = "⎘", 2000);
      });
    }

    function downloadBlog() {
      if (!currentBlog) return;
      const blob = new Blob([currentBlog], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = currentTopic.replace(/\s+/g, "_") + ".txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("topic").addEventListener("keydown", e => {
      if (e.key === "Enter") generateBlog();
    });
  </script>
</body>
</html>
